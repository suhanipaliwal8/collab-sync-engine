name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab_dev_password
          POSTGRES_DB: collab_sync
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U collab -d collab_sync"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test