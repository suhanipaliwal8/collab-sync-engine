services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab_dev_password   # local development only
      POSTGRES_DB: collab_sync
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab_sync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: